name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push replaces a deploy that is still running.
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build on GitHub's runner, not on the server: faster, and a broken build
      # fails here before anything on the server changes.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # The vault and its API share https://app.2keevo.com.
          VITE_APP_API_URL: ${{ vars.VITE_APP_API_URL || 'https://app.2keevo.com' }}

      # nginx serves dist/ as static files, so the build is all the server needs.
      - name: Package
        run: tar -czf frontend-release.tgz dist

      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 9999 }}
          source: frontend-release.tgz
          target: ${{ secrets.DEPLOY_PATH_FRONT }}/.deploy
          overwrite: true
          timeout: 120s

      - name: Switch to the new build
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 9999 }}
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH_FRONT }}"
            cd "$APP_DIR"
            NEW=.deploy/new
            rm -rf "$NEW" && mkdir -p "$NEW"
            tar -xzf .deploy/frontend-release.tgz -C "$NEW"

            # nginx serves dist/ directly (app.2keevo.com), so swapping the folder is the deploy.
            # The previous build stays as dist.previous for a quick manual rollback.
            rm -rf dist.previous
            if [ -d dist ]; then mv dist dist.previous; fi
            mv "$NEW/dist" dist

            rm -rf "$NEW" .deploy/frontend-release.tgz
            echo "Deployed $(ls dist/assets | wc -l) asset files"
