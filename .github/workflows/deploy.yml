name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: ".,!node_modules,!dist,!.git,!.env,!server"
          target: ${{ secrets.DEPLOY_PATH_FRONT }}
          overwrite: true
          rm: false
          timeout: 120s

      - name: Install, build, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH_FRONT }}"
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              if [ -z "${{ secrets.VITE_APP_API_URL }}" ]; then
                echo "Missing .env and VITE_APP_API_URL secret"
                exit 1
              fi
              echo "VITE_APP_API_URL=${{ secrets.VITE_APP_API_URL }}" > .env
            fi

            npm install
            npm run build
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
            pm2 status notes-frontend
